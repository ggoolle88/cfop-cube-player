<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// =====================================================================
// 1. Parser：標準 WCA / Singmaster 記號 → Move[]
//    支援：R U F L D B、' 與 2、寬層 r / Rw、中層 M E S、整體轉 x y z、
//         括號重複 (R U R' U')2、反向群組 (R U)'、// 註解
// =====================================================================
const PI_2 = Math.PI / 2;

// dir = 該面「順時針 1/4 圈」時繞 +axis 的旋轉方向（右手座標系）
const FACE_DEFS = {
  R: { axis: 'x', layers: [1],        dir: -1 },
  L: { axis: 'x', layers: [-1],       dir:  1 },
  U: { axis: 'y', layers: [1],        dir: -1 },
  D: { axis: 'y', layers: [-1],       dir:  1 },
  F: { axis: 'z', layers: [1],        dir: -1 },
  B: { axis: 'z', layers: [-1],       dir:  1 },
  M: { axis: 'x', layers: [0],        dir:  1 },  // 同 L 方向
  E: { axis: 'y', layers: [0],        dir:  1 },  // 同 D 方向
  S: { axis: 'z', layers: [0],        dir: -1 },  // 同 F 方向
  x: { axis: 'x', layers: [-1, 0, 1], dir: -1 },  // 同 R 方向
  y: { axis: 'y', layers: [-1, 0, 1], dir: -1 },  // 同 U 方向
  z: { axis: 'z', layers: [-1, 0, 1], dir: -1 },  // 同 F 方向
};

class AlgParseError extends Error {}

function makeMove(family, amount) {
  const wide = family.length === 2 || /^[rludfb]$/.test(family);
  const base = FACE_DEFS[wide ? family[0].toUpperCase() : family];
  const layers = wide ? [base.layers[0], 0] : base.layers;
  const abs = Math.abs(amount);
  return {
    family, amount, axis: base.axis, layers,
    angle: base.dir * amount * PI_2,
    notation: family + (abs !== 1 ? abs : '') + (amount < 0 ? "'" : ''),
  };
}

const invertMove = (m) => makeMove(m.family, -m.amount);
const invertAlg = (moves) => moves.slice().reverse().map(invertMove);

export function parseAlg(source) {
  const s = source.replace(/[’′‘`]/g, "'").replace(/\/\/.*$/gm, '');
  let i = 0;

  const readAmount = () => {
    const m = /^(\d*)('?)/.exec(s.slice(i));
    i += m[0].length;
    const n = m[1] ? parseInt(m[1], 10) : 1;
    return m[2] ? -n : n;
  };

  const parseSeq = (inGroup) => {
    const out = [];
    for (;;) {
      while (i < s.length && /\s/.test(s[i])) i++;
      if (i >= s.length) {
        if (inGroup) throw new AlgParseError('缺少右括號 )');
        return out;
      }
      const c = s[i];
      if (c === '(') { i++; out.push(...parseSeq(true)); continue; }
      if (c === ')') {
        if (!inGroup) throw new AlgParseError(`位置 ${i + 1}：多餘的 )`);
        i++;
        const times = readAmount();
        const unit = times < 0 ? invertAlg(out) : out;
        return Array.from({ length: Math.abs(times) }, () => unit).flat();
      }
      const m = /^([RLUDFB]w|[RLUDFBMESxyzrludfb])/.exec(s.slice(i));
      if (!m) throw new AlgParseError(`位置 ${i + 1}：無法辨識的符號 "${c}"`);
      i += m[1].length;
      const amount = readAmount();
      if (amount % 4 !== 0) out.push(makeMove(m[1], amount));
    }
  };
  return parseSeq(false);
}

// =====================================================================
// 2. 3x3x3 模型：每個小塊記錄「離散狀態」(整數座標 + 四元數)，
//    渲染時再疊加正在進行中那一步的部分旋轉 → 任意進度都可直接重算
// =====================================================================
const COLORS = { U: 0xffffff, D: 0xffd500, F: 0x009e60, B: 0x0051ba, R: 0xc41e3a, L: 0xff5800 };
const FACE_NORMALS = [
  ['R', new THREE.Vector3(1, 0, 0)], ['L', new THREE.Vector3(-1, 0, 0)],
  ['U', new THREE.Vector3(0, 1, 0)], ['D', new THREE.Vector3(0, -1, 0)],
  ['F', new THREE.Vector3(0, 0, 1)], ['B', new THREE.Vector3(0, 0, -1)],
];
const SPACING = 1.02;
const AXES = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };

class CubeModel {
  constructor(scene) {
    this.root = new THREE.Group();
    scene.add(this.root);
    this.cubies = [];

    const bodyGeo = new THREE.BoxGeometry(0.96, 0.96, 0.96);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.6 });
    const stickerGeo = new THREE.PlaneGeometry(0.82, 0.82);
    const stickerMats = Object.fromEntries(Object.entries(COLORS).map(
      ([f, c]) => [f, new THREE.MeshStandardMaterial({ color: c, roughness: 0.35 })]));

    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
      if (!x && !y && !z) continue;
      const home = new THREE.Vector3(x, y, z);
      const obj = new THREE.Group();
      obj.add(new THREE.Mesh(bodyGeo, bodyMat));
      for (const [face, n] of FACE_NORMALS) {
        if (home.dot(n) !== 1) continue;
        const sticker = new THREE.Mesh(stickerGeo, stickerMats[face]);
        sticker.position.copy(n).multiplyScalar(0.481);
        sticker.lookAt(n.clone().multiplyScalar(2));
        obj.add(sticker);
      }
      this.root.add(obj);
      this.cubies.push({ obj, home, pos: home.clone(), quat: new THREE.Quaternion() });
    }
  }

  reset() {
    for (const c of this.cubies) { c.pos.copy(c.home); c.quat.identity(); }
  }

  inLayer(c, move) {
    return move.layers.includes(Math.round(c.pos[move.axis]));
  }

  applyMove(move) {
    const q = new THREE.Quaternion().setFromAxisAngle(AXES[move.axis], move.angle);
    for (const c of this.cubies) {
      if (!this.inLayer(c, move)) continue;
      c.pos.applyQuaternion(q).round();
      c.quat.premultiply(q).normalize();
    }
  }

  // activeMove 進行到 t (0..1) 的畫面
  render(activeMove, t) {
    const q = activeMove
      ? new THREE.Quaternion().setFromAxisAngle(AXES[activeMove.axis], activeMove.angle * t)
      : null;
    for (const c of this.cubies) {
      c.obj.position.copy(c.pos);
      c.obj.quaternion.copy(c.quat);
      if (q && this.inLayer(c, activeMove)) {
        c.obj.position.applyQuaternion(q);
        c.obj.quaternion.premultiply(q);
      }
      c.obj.position.multiplyScalar(SPACING);
    }
  }
}

// =====================================================================
// 3. Animation Engine：以連續的 position (0..N，單位＝步) 描述時間軸
//    播放 / 暫停 / 單步 / 拖曳都只是改變 position 或 target
// =====================================================================
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

class AlgPlayer extends EventTarget {
  constructor(model) {
    super();
    this.model = model;
    this.moves = [];
    this.setup = [];
    this.position = 0;   // 目前進度（可為小數）
    this.target = null;  // 動畫要前往的進度；null = 暫停
    this.baked = 0;      // 已寫入 model 離散狀態的步數
    this.speed = 1;
    this.msPerMove = 420;
  }

  get length() { return this.moves.length; }
  get playing() { return this.target !== null; }

  load(moves, setup = []) {
    this.moves = moves;
    this.setup = setup;
    this.target = null;
    this.position = 0;
    this.rebuild();
    this.sync();
  }

  rebuild() {
    this.model.reset();
    this.setup.forEach((m) => this.model.applyMove(m));
    this.baked = 0;
  }

  sync() {
    const k = Math.min(Math.floor(this.position), this.length);
    if (k < this.baked) this.rebuild();          // 倒退：從頭重算，避免累積浮點誤差
    while (this.baked < k) this.model.applyMove(this.moves[this.baked++]);
    const frac = this.position - k;
    this.model.render(frac > 0 ? this.moves[k] : null, easeInOutCubic(frac));
    this.dispatchEvent(new Event('change'));
  }

  seek(p) { this.target = null; this.position = THREE.MathUtils.clamp(p, 0, this.length); this.sync(); }
  play() { if (this.position >= this.length) this.seek(0); this.target = this.length; this.sync(); }
  pause() { this.target = null; this.sync(); }
  toggle() { this.playing ? this.pause() : this.play(); }
  stepForward() { this.target = Math.min(Math.floor(this.position + 1e-6) + 1, this.length); }
  stepBack() { this.target = Math.max(Math.ceil(this.position - 1e-6) - 1, 0); }

  update(dtMs) {
    if (this.target === null) return;
    const step = (dtMs * this.speed) / this.msPerMove;
    const d = this.target - this.position;
    if (Math.abs(d) <= step) { this.position = this.target; this.target = null; }
    else this.position += Math.sign(d) * step;
    this.sync();
  }
}

// =====================================================================
// 4. 場景 + UI 綁定
// =====================================================================
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(5.2, 4.6, 7.2);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(4, 8, 6);
scene.add(sun);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enablePan = false;
orbit.enableDamping = true;
orbit.minDistance = 6;
orbit.maxDistance = 16;

new ResizeObserver(() => {
  const { clientWidth: w, clientHeight: h } = viewport;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}).observe(viewport);

const model = new CubeModel(scene);
const player = new AlgPlayer(model);

// 案例選擇器：依圖片挑公式（圖示資料由模擬器計算，保證與公式一致）
// 面代號是「黃色朝上」握法下的面；配色只在 DIAGRAM_COLORS 這一處

// 頂視圖：9 格頂面 + 4 條側邊（各面外側正視由左至右）；colorOf 回傳 null 表示不畫
function topViewSVG(top, sides, colorOf, arrows = []) {
  const c = 10, g = 1, o = 4, base = o + g, edge = base + 3 * (c + g), size = edge + o;
  const rects = [];
  const cell = (x, y, w, h, ch) => {
    const fill = colorOf(ch);
    if (fill) rects.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="${fill}" stroke="#222" stroke-width=".4"/>`);
  };
  [...top].forEach((ch, i) => cell(base + (i % 3) * (c + g), base + Math.floor(i / 3) * (c + g), c, c, ch));
  [...sides.F].forEach((ch, i) => cell(base + i * (c + g), edge, c, o, ch));
  [...sides.R].forEach((ch, i) => cell(edge, base + (2 - i) * (c + g), o, c, ch));
  [...sides.B].forEach((ch, i) => cell(base + (2 - i) * (c + g), 0, c, o, ch));
  [...sides.L].forEach((ch, i) => cell(0, base + i * (c + g), o, c, ch));
  const center = (i) => [base + (i % 3) * (c + g) + c / 2, base + Math.floor(i / 3) * (c + g) + c / 2];
  const lines = arrows.map(([from, to, both]) => {
    const [x1, y1] = center(from), [x2, y2] = center(to);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="1"
      marker-end="url(#ah)"${both ? ' marker-start="url(#ah)"' : ''}/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}"><defs><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3"
    markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L6,3L0,6z" fill="#111"/></marker></defs>
    ${rects.join('')}${lines}</svg>`;
}

// 等角視圖：頂面、前面、右面各 9 格（F2L 用；只上色前兩層與目標角塊／棱塊）
function isoSVG(stickers) {
  const P = (x, y, z) => `${((x - z) * 0.866).toFixed(3)},${((x + z) * 0.5 - y).toFixed(3)}`;
  const s = 0.46, quads = [];
  for (let z = -1; z <= 1; z++) for (let x = -1; x <= 1; x++)
    quads.push([P(x - s, 1.5, z - s), P(x + s, 1.5, z - s), P(x + s, 1.5, z + s), P(x - s, 1.5, z + s)]);
  for (let y = 1; y >= -1; y--) for (let x = -1; x <= 1; x++)
    quads.push([P(x - s, y + s, 1.5), P(x + s, y + s, 1.5), P(x + s, y - s, 1.5), P(x - s, y - s, 1.5)]);
  for (let y = 1; y >= -1; y--) for (let z = 1; z >= -1; z--)
    quads.push([P(1.5, y + s, z + s), P(1.5, y + s, z - s), P(1.5, y - s, z - s), P(1.5, y - s, z + s)]);
  const body = [P(-1.5, 1.5, -1.5), P(1.5, 1.5, -1.5), P(1.5, -1.5, -1.5), P(1.5, -1.5, 1.5), P(-1.5, -1.5, 1.5), P(-1.5, 1.5, 1.5)];
  return `<svg viewBox="-2.75 -3.15 5.5 6.3"><polygon points="${body.join(' ')}" fill="#222"/>
    ${quads.map((q, i) => `<polygon points="${q.join(' ')}" fill="${DIAGRAM_COLORS[stickers[i]]}"/>`).join('')}</svg>`;
}

const thumbOf = {
  PLL: (c) => topViewSVG('UUUUUUUUU', c.sides, (ch) => DIAGRAM_COLORS[ch], c.arrows),
  // OLL：頂面非黃格畫灰色，側邊只畫黃色貼紙（同常見公式表）
  OLL: (c) => topViewSVG(c.top.replace(/0/g, '-'), c.sides,
    (ch) => (ch === '1' ? DIAGRAM_COLORS.U : ch === '-' ? DIAGRAM_COLORS['-'] : null)),
  F2L: (c) => isoSVG(c.iso),
};

const picker = document.getElementById('cases');
let activeCard = null;

function cardHTML(group, c, i) {
  return `<button class="case" data-group="${group}" data-i="${i}" title="${c.alg}">
    ${thumbOf[group](c)}<span>${c.name}</span>${c.white ? `<small>${c.white}</small>` : ''}</button>`;
}

function showGroup(group) {
  document.querySelectorAll('.picker-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.g === group));
  const list = CASES[group].map((c, i) => [c, i]);
  if (group !== 'F2L') {
    picker.innerHTML = `<div class="grid">${list.map(([c, i]) => cardHTML(group, c, i)).join('')}</div>`;
  } else {
    const order = { '白朝上': 0, '白朝前': 1, '白朝右': 2, '白朝下': 3 };
    picker.innerHTML = F2L_GROUPS.map((title, gi) => `<h3>${title}</h3><div class="grid">${list
      .filter(([c]) => c.group === gi)
      .sort(([a], [b]) => order[a.white] - order[b.white])
      .map(([c, i]) => cardHTML(group, c, i)).join('')}</div>`).join('') +
      `<h3>白色方塊在底層（同伴在第二層不相鄰）</h3>
       <p class="muted">同伴卡在另一個槽，不屬於標準 41 種。先把同伴所在的槽「拿出來再放回去」
       （例如同伴在左前槽時做 L' U' L），讓同伴回到上層，就會變成上面「白色方塊在底層」的情況。</p>`;
  }
  markActive();
}

function markActive() {
  picker.querySelectorAll('.case').forEach((b) =>
    b.classList.toggle('on', !!activeCard && b.dataset.group === activeCard[0] && +b.dataset.i === activeCard[1]));
}

document.querySelector('.picker-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) showGroup(b.dataset.g);
});
picker.addEventListener('click', (e) => {
  const b = e.target.closest('.case');
  if (!b) return;
  activeCard = [b.dataset.group, +b.dataset.i];
  ui.alg.value = CASES[activeCard[0]][activeCard[1]].alg;
  loadFromInput();
  markActive();
  // 窄螢幕（上下排列）才需要捲回方塊；寬螢幕兩欄並排不捲動
  if (!matchMedia('(min-width: 760px)').matches) {
    document.getElementById('viewport').scrollIntoView({ behavior: 'smooth' });
  }
});
activeCard = ['PLL', CASES.PLL.findIndex((c) => c.name === 'T-Perm')];

const $ = (id) => document.getElementById(id);
const ui = {
  alg: $('alg'), load: $('load'), caseMode: $('caseMode'), yellowTop: $('yellowTop'),
  moves: $('moves'), scrub: $('scrub'), play: $('play'), prev: $('prev'), next: $('next'),
  reset: $('reset'), speed: $('speed'), counter: $('counter'), error: $('error'),
};

function loadFromInput() {
  try {
    const moves = parseAlg(ui.alg.value);
    const setup = [
      ...(ui.yellowTop.checked ? parseAlg('z2') : []),
      ...(ui.caseMode.checked ? invertAlg(moves) : []),
    ];
    player.load(moves, setup);
    ui.error.textContent = '';
    ui.scrub.max = moves.length;
    ui.moves.innerHTML = '';
    moves.forEach((m, idx) => {
      const chip = document.createElement('span');
      chip.textContent = m.notation;
      chip.onclick = () => player.seek(idx + 1);   // 點擊某步 → 跳到該步完成
      ui.moves.appendChild(chip);
    });
    updateUI();
  } catch (e) {
    if (!(e instanceof AlgParseError)) throw e;
    ui.error.textContent = e.message;
  }
}

function updateUI() {
  const p = player.position;
  const k = Math.floor(p);
  ui.scrub.value = p;
  ui.play.textContent = player.playing ? '❚❚ 暫停' : '▶ 播放';
  ui.counter.textContent = `第 ${Math.min(Math.ceil(p - 1e-6), player.length)} / ${player.length} 步`;
  [...ui.moves.children].forEach((chip, idx) => {
    chip.classList.toggle('done', idx < k);
    chip.classList.toggle('active', idx === k && p - k > 0);
  });
}

player.addEventListener('change', updateUI);
ui.load.onclick = loadFromInput;
ui.alg.onkeydown = (e) => { if (e.key === 'Enter') loadFromInput(); };
ui.alg.oninput = () => { activeCard = null; markActive(); };
ui.caseMode.onchange = ui.yellowTop.onchange = loadFromInput;
ui.play.onclick = () => player.toggle();
ui.prev.onclick = () => player.stepBack();
ui.next.onclick = () => player.stepForward();
ui.reset.onclick = () => player.seek(0);
ui.speed.onchange = () => { player.speed = Number(ui.speed.value); };
ui.scrub.oninput = () => player.seek(Number(ui.scrub.value));
document.addEventListener('keydown', (e) => {
  if (e.target === ui.alg) return;
  if (e.code === 'Space') { e.preventDefault(); player.toggle(); }
  if (e.code === 'ArrowRight') player.stepForward();
  if (e.code === 'ArrowLeft') player.stepBack();
});

let last = performance.now();
renderer.setAnimationLoop((now) => {
  player.update(now - last);
  last = now;
  orbit.update();
  renderer.render(scene, camera);
});

loadFromInput();
showGroup(location.hash.slice(1) in CASES ? location.hash.slice(1) : 'PLL');
</script>
</body>
</html>
